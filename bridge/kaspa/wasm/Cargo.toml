[package]
name = "kusdt-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "kUSDT transaction builders for browsers and Node (WebAssembly)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kusdt-kaspa = { path = "..", default-features = false }
wasm-bindgen = "=0.2.100"
serde_json = "1"
# Randomness for secp256k1 contexts comes from the JS crypto API.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
